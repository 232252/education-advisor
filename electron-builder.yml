appId: com.education-advisor.app
productName: Education Advisor
copyright: Copyright 2026

# CI 通过 --publish onTag 发布并生成 latest*.yml 自动更新清单
# 本地构建不加 --publish 时默认 onTagOrDraft（仅 tag 提交才发布）
publish:
  provider: github
  owner: 232252
  repo: education-advisor

directories:
  output: release-v11
  buildResources: resources

files:
  - dist/**/*
  - node_modules/**/*
  # ---- 瘦身负向过滤：体积大头与散文件数（NSIS 逐文件解压写盘是安装慢的主因）----
  # pnpm 包根目录 8 份 ~50MB 二进制别名（node_modules 里彼此硬链接，复制进安装
  # 包后变成实体，共 ~391MB，是旧包最大单项）。运行时用 @pnpm/exe 的独立
  # pnpm.exe（PATH 前置，见 pnpm-env.ts）—— pnpm 12 的 bin/pnpm.mjs 只是
  # corepack 引导壳，真 CLI 只有 @pnpm/exe 的原生二进制，替代方案实测死路
  # （2026-11-09：Rust 启动器转发 pnpm.mjs 的方案已废弃）。
  # 注意 builder 会把 pnpm/dist/node_modules 嵌套依赖跳过，由 afterPack
  # （scripts/after-pack-trim.mjs）补回，引导壳兜底链路才完整。
  - "!node_modules/pnpm/pn"
  - "!node_modules/pnpm/pn.exe"
  - "!node_modules/pnpm/pnpm"
  - "!node_modules/pnpm/pnpm.exe"
  - "!node_modules/pnpm/pnpx"
  - "!node_modules/pnpm/pnpx.exe"
  - "!node_modules/pnpm/pnx"
  - "!node_modules/pnpm/pnx.exe"
  # dsh 实验性大包（inspector 调试器 25MB / sensevoice 本地语音转写 + sherpa
  # 二进制 ~35MB）：不在连接中心 web profile 的 bundles 清单里（profile 只装
  # dsh-base / dsh-web-app / dsh-im / eaa 四件套），进包纯属占体积。教师要用时
  # 经插件市场联网安装 —— PATH 修复后（pnpm-env.ts）该链路本身可用。
  - "!node_modules/@deepseek-ai/dsh-experimental-inspector/**"
  - "!node_modules/@deepseek-ai/dsh-experimental-speech-to-text-sensevoice/**"
  - "!node_modules/sherpa-onnx-node/**"
  - "!node_modules/sherpa-onnx-win-x64/**"
  # 同理的 OPTIONAL_BUNDLES 负载（dsh-official-bundles：默认关闭、插件市场可
  # 后装）：liveshare 协作 2MB / forge 的 UI 件 2MB。verify-dsh-package 的闭包
  # 安全网会断言它们不在 web/sdk profile 的硬依赖闭包里。
  - "!node_modules/@deepseek-ai/dsh-experimental-liveshare/**"
  - "!node_modules/@deepseek-ai/dsh-experimental-client-ui-forge/**"
  # libreoffice-kit 平台包（184MB/735 文件，曾占主树 37%）不再预解压随包：
  # 改随包只带 1 个 zip（prepackage 的 build-office-kit-asset.mjs 产出 65.8MB，
  # afterPack 复制进 resources/office-kit/——走钩子不走 extraResources，免得
  # mac/linux 构建被缺目录卡死），首次 AI 转 PDF 时 office-kit-service 本地
  # 解压到 userData（不联网，一次性几秒；闲时预热通常首启后台就完成）。
  # 全离线直装不变，安装少写 735 个文件/~110MB。
  - "!node_modules/@deepseek-ai/libreoffice-kit-win32-x64/**"
  # source map 是散文件数第一大头（lucide-react/openai/rxjs 等共 ~1.07 万个
  # / 11MB），运行时无人读取，砍掉直接缩短安装写盘时间。
  - "!**/*.map"
  # 依赖包的 README/CHANGELOG 不进安装包（~2000 个散文件）。注意不能用
  # !**/*.md 一刀切：dsh 体系把 docs/*.md 当 AI 技能说明书在运行时引用。
  - "!**/README*.md"
  - "!**/CHANGELOG*.md"
  - "!**/{test,tests,__tests__}/**"
  # 只面向 Windows x64 教师机的多平台二进制：node-pty 的 win32-arm64 prebuild
  # 12MB + third_party 里的 arm64 conpty；sharp 的 wasm 兜底实现（win32-x64
  # 原生二进制已随包）。
  - "!node_modules/node-pty/prebuilds/win32-arm64/**"
  - "!node_modules/node-pty/third_party/**/win10-arm64/**"
  - "!node_modules/@img/sharp-wasm32/**"
  # 字体三包是纯构建期依赖：渲染层只跑 vite 发射进 dist 的哈希资产（lxgw light
  # 97 分片经 main.tsx JS import 发射；jetbrains 6 个、inter 2 个同理），打包态
  # 没有任何代码路径读 app.asar.unpacked 里的包体。整包随包纯烧 ~950 个散文件
  # /~30MB。verify-dsh-package --dist 会断言产物内三包不存在、dist 内字体资产
  # 在位（批注手写体曾因 @import 路径 404 静默回退楷体，见 main.tsx 注释）。
  - "!node_modules/lxgw-wenkai-webfont/**"
  - "!node_modules/@fontsource/jetbrains-mono/**"
  - "!node_modules/@fontsource-variable/inter/**"

# 只随中文界面与英文兜底（Electron locales 全量 55 个 .pak 共 49MB）。
# 界面语言不依赖 Chromium locale 包，砍掉的只是死重。
