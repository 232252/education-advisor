appId: com.education-advisor.app
productName: Education Advisor
copyright: Copyright 2026

# CI 通过 --publish onTag 发布并生成 latest*.yml 自动更新清单
# 本地构建不加 --publish 时默认 onTagOrDraft（仅 tag 提交才发布）
publish:
  provider: github
  owner: 232252
  repo: education-advisor

directories:
  output: release-v11
  buildResources: resources

files:
  - dist/**/*
  - node_modules/**/*

extraResources:
  - from: resources/icon.ico
    to: icon.ico
  - from: resources/icon.png
    to: icon.png
  # 托盘多分辨率帧 (16@1x / 32@2x), 高 DPI 下托盘图标清晰
  - from: resources/icon-16.png
    to: icon-16.png
  - from: resources/icon-32.png
    to: icon-32.png
  - from: resources/eaa-binaries/
    to: eaa-binaries/
    filter: ["**/*"]
  - from: config/
    to: config/
    filter: ["**/*"]
  - from: agents/
    to: agents/
    filter: ["**/*"]
  # 内置技能随包分发 — skill-service 打包态读 process.resourcesPath/skills,
  # 缺此条则安装版系统提示词的技能清单为空
  - from: skills/
    to: skills/
    filter: ["**/*"]

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: resources/icon.ico
  # R2 固定命名（去版本号）：官网下载页用 releases/latest/download/<固定名>
  # 做零维护兜底链接，release 资产名跨版本稳定；CI 全部按 glob 收集不受影响。
  artifactName: "Education-Advisor-Setup.${ext}"

# portable 沿用 win.artifactName 会与 NSIS 输出同名互相覆盖，
# 并导致同一文件被并发重复上传（曾引发 Request timed out），
# 这里单独命名为 Portable 以区分。
portable:
  artifactName: "Education-Advisor-Portable.${ext}"

# macOS 产物显式无空格命名：electron-builder 的 ArchiveTarget（mac zip）
# 生成 blockmap 时传入的是带空格的原始文件名（上游 bug），GitHub 会把
# 空格规范化为点号，导致重跑同一 tag 时资产名匹配失败（422 already_exists）。
# 无空格命名后 dmg/zip/blockmap 名称跨运行完全一致，覆盖上传可靠。
mac:
  artifactName: "Education-Advisor-${arch}.${ext}"

# 显式指定 Linux 目标：electron-builder 26 未配置时默认构建 snap，
# GitHub runner 无 snapcraft 必然失败，且 deb 也不会被构建。
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Education
  # 与 win/mac 同理固定命名（deb 内部版本号仍来自 package.json，不受文件名影响）
  artifactName: "Education-Advisor.${ext}"
  # deb 包要求 maintainer（package.json author 无 email 时必须显式指定）
  maintainer: "232252 <111100881+232252@users.noreply.github.com>"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true

# 不从源码重编原生模块：better-sqlite3 / node-pty / koffi 随包都带 N-API prebuilds，
# 实测在 Electron 43 的 ABI(148) 与本机 node 的 ABI(147) 下都能 require 并跑通真实
# SQL；而源码重编在本机会卡在 node-pty 的 MSB8040(要 VS 的 Spectre 库组件)，即使
# 成功也会把 Electron ABI 的 build/Release/*.node 写进 node_modules，反过来让
# vitest(纯 node)加载失败。关掉它等于把"上次产物里其实只有 prebuilds"这件事写明。
npmRebuild: false

asar: true
asarUnpack:
  - "**/*.exe"
  - "**/*.node"
  - "**/*.dll"
  # dsh 后端要另起一个**纯 node**子进程跑 @deepseek-ai/dsh（SDK 用 process.execPath
  # + ELECTRON_RUN_AS_NODE 启动它）。归档只对主进程透明，node 子进程看不见 app.asar，
  # 所以整棵依赖树必须以真实文件形式落在 app.asar.unpacked 下 —— 只挑 @deepseek-ai/*
  # 不够，cosmokit / schemastery / node-addon-system 这些非 scoped 传递依赖也得在。
  # 安装体积不变（解出的文件不再进归档），只是文件数变多。
  - "**/node_modules/**"
