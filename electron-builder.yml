appId: com.education-advisor.app
productName: Education Advisor
copyright: Copyright 2026

# CI 通过 --publish onTag 发布并生成 latest*.yml 自动更新清单
# 本地构建不加 --publish 时默认 onTagOrDraft（仅 tag 提交才发布）
publish:
  provider: github
  owner: 232252
  repo: education-advisor

directories:
  output: release-v11
  buildResources: resources

files:
  - dist/**/*
  - node_modules/**/*
  # ---- 瘦身负向过滤：体积大头与散文件数（NSIS 逐文件解压写盘是安装慢的主因）----
  # pnpm 包根目录 8 份 ~50MB 二进制别名（node_modules 里彼此硬链接，复制进安装
  # 包后变成实体，共 ~391MB，是旧包最大单项）。运行时用 @pnpm/exe 的独立
  # pnpm.exe（PATH 前置，见 pnpm-env.ts）—— pnpm 12 的 bin/pnpm.mjs 只是
  # corepack 引导壳，真 CLI 只有 @pnpm/exe 的原生二进制，替代方案实测死路
  # （2026-11-09：Rust 启动器转发 pnpm.mjs 的方案已废弃）。
  # 注意 builder 会把 pnpm/dist/node_modules 嵌套依赖跳过，由 afterPack
  # （scripts/after-pack-trim.mjs）补回，引导壳兜底链路才完整。
  - "!node_modules/pnpm/pn"
  - "!node_modules/pnpm/pn.exe"
  - "!node_modules/pnpm/pnpm"
  - "!node_modules/pnpm/pnpm.exe"
  - "!node_modules/pnpm/pnpx"
  - "!node_modules/pnpm/pnpx.exe"
  - "!node_modules/pnpm/pnx"
  - "!node_modules/pnpm/pnx.exe"
  # dsh 实验性大包（inspector 调试器 25MB / sensevoice 本地语音转写 + sherpa
  # 二进制 ~35MB）：不在连接中心 web profile 的 bundles 清单里（profile 只装
  # dsh-base / dsh-web-app / dsh-im / eaa 四件套），进包纯属占体积。教师要用时
  # 经插件市场联网安装 —— PATH 修复后（pnpm-env.ts）该链路本身可用。
  - "!node_modules/@deepseek-ai/dsh-experimental-inspector/**"
  - "!node_modules/@deepseek-ai/dsh-experimental-speech-to-text-sensevoice/**"
  - "!node_modules/sherpa-onnx-node/**"
  - "!node_modules/sherpa-onnx-win-x64/**"
  # 同理的 OPTIONAL_BUNDLES 负载（dsh-official-bundles：默认关闭、插件市场可
  # 后装）：liveshare 协作 2MB / forge 的 UI 件 2MB。verify-dsh-package 的闭包
  # 安全网会断言它们不在 web/sdk profile 的硬依赖闭包里。
  - "!node_modules/@deepseek-ai/dsh-experimental-liveshare/**"
  - "!node_modules/@deepseek-ai/dsh-experimental-client-ui-forge/**"
  # libreoffice-kit 平台包（184MB/735 文件，曾占主树 37%）不再预解压随包：
  # 改随包只带 1 个 zip（prepackage 的 build-office-kit-asset.mjs 产出 65.8MB，
  # afterPack 复制进 resources/office-kit/——走钩子不走 extraResources，免得
  # mac/linux 构建被缺目录卡死），首次 AI 转 PDF 时 office-kit-service 本地
  # 解压到 userData（不联网，一次性几秒；闲时预热通常首启后台就完成）。
  # 全离线直装不变，安装少写 735 个文件/~110MB。
  - "!node_modules/@deepseek-ai/libreoffice-kit-win32-x64/**"
  # source map 是散文件数第一大头（lucide-react/openai/rxjs 等共 ~1.07 万个
  # / 11MB），运行时无人读取，砍掉直接缩短安装写盘时间。
  - "!**/*.map"
  # 依赖包的 README/CHANGELOG 不进安装包（~2000 个散文件）。注意不能用
  # !**/*.md 一刀切：dsh 体系把 docs/*.md 当 AI 技能说明书在运行时引用。
  - "!**/README*.md"
  - "!**/CHANGELOG*.md"
  - "!**/{test,tests,__tests__}/**"
  # 只面向 Windows x64 教师机的多平台二进制：node-pty 的 win32-arm64 prebuild
  # 12MB + third_party 里的 arm64 conpty；sharp 的 wasm 兜底实现（win32-x64
  # 原生二进制已随包）。
  - "!node_modules/node-pty/prebuilds/win32-arm64/**"
  - "!node_modules/node-pty/third_party/**/win10-arm64/**"
  - "!node_modules/@img/sharp-wasm32/**"
  # 字体三包是纯构建期依赖：渲染层只跑 vite 发射进 dist 的哈希资产（lxgw light
  # 97 分片经 main.tsx JS import 发射；jetbrains 6 个、inter 2 个同理），打包态
  # 没有任何代码路径读 app.asar.unpacked 里的包体。整包随包纯烧 ~950 个散文件
  # /~30MB。verify-dsh-package --dist 会断言产物内三包不存在、dist 内字体资产
  # 在位（批注手写体曾因 @import 路径 404 静默回退楷体，见 main.tsx 注释）。
  - "!node_modules/lxgw-wenkai-webfont/**"
  - "!node_modules/@fontsource/jetbrains-mono/**"
  - "!node_modules/@fontsource-variable/inter/**"

# 只随中文界面与英文兜底（Electron locales 全量 55 个 .pak 共 49MB）。
# 界面语言不依赖 Chromium locale 包，砍掉的只是死重。
electronLanguages:
  - zh-CN
  - en-US

# 打包后修剪（scripts/after-pack-trim.mjs）：删 WebGPU 用的 dxcompiler.dll
# （app 不用 WebGPU，25MB）与 win 包里多余的 eaa-binaries 其他平台目录，
# 并断言 locales/排除项确实生效——配置错了在这里拦，别等装到教师机才发现。
afterPack: scripts/after-pack-trim.mjs

extraResources:
  - from: resources/icon.ico
    to: icon.ico
  - from: resources/icon.png
    to: icon.png
  # 托盘多分辨率帧 (16@1x / 32@2x), 高 DPI 下托盘图标清晰
  - from: resources/icon-16.png
    to: icon-16.png
  - from: resources/icon-32.png
    to: icon-32.png
  - from: resources/eaa-binaries/
    to: eaa-binaries/
    filter: ["**/*"]
  - from: config/
    to: config/
    filter: ["**/*"]
  - from: agents/
    to: agents/
    filter: ["**/*"]
  # dsh-im 5.10.0：连接中心用 link: 装进 web profile，不能打进 asar。
  # 负向过滤只砍确认的死重：文档与 README 大图（lib/plugin-src 运行时会引用
  # src、plugin-src、docs、scripts、bin，这些目录必须保留）、sharp 的 wasm
  # 兜底二进制（win32-x64 原生版已随包）、依赖包自带的 README 与 source map。
  # 注意：builder 复制 extraResources 时整目录丢弃 node_modules，离线首开
  # 依赖由 afterPack（scripts/after-pack-trim.mjs）补回到 resources/dsh-im。
  - from: vendor/dsh-im/
    to: dsh-im/
    filter:
      - "**/*"
      - "!README*.md"
      - "!PROACTIVE_DELIVERY*.md"
      - "!CONTEXT.md"
      - "!CHANGELOG.md"
      - "!package-lock.json"
      - "!assets/sponsors/**"
      - "!assets/logo_cn.png"
      - "!assets/logo-dsh-im-*.png"
      - "!assets/screenshot-menu-card.png"
      - "!node_modules/@img/sharp-wasm32/**"
      - "!node_modules/**/*.map"
      - "!node_modules/**/README*.md"
      - "!node_modules/**/CHANGELOG*.md"
  # 教育插件：link: 进 profile，学生数据不在包里。同级目录才会被一起装上。
  - from: vendor/eaa-tools/
    to: eaa-tools/
    filter: ["**/*"]
  - from: vendor/eaa-roster/
    to: eaa-roster/
    filter: ["**/*"]
  - from: vendor/eaa-grades/
    to: eaa-grades/
    filter: ["**/*"]
  - from: vendor/eaa-grading/
    to: eaa-grading/
    filter: ["**/*"]
  # dsh 0.2.1 拒绝 Electron 内置运行时指纹。打包前由 scripts/stage-dsh-node.mjs 放入。
  - from: vendor/dsh-node/
    to: dsh-node/
    filter: ["node.exe", "node"]
  # 内置技能随包分发 — skill-service 打包态读 process.resourcesPath/skills,
  # 缺此条则安装版系统提示词的技能清单为空
  - from: skills/
    to: skills/
    filter: ["**/*"]

win:
  # 只发 NSIS 安装包（2026-11-09 决策停发 Portable）：发布带宽/构建时间减半，
  # 下载页只维护 Setup 一个入口。
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.ico
  # R2 固定命名（去版本号）：官网下载页用 releases/latest/download/<固定名>
  # 做零维护兜底链接，release 资产名跨版本稳定；CI 全部按 glob 收集不受影响。
  artifactName: "Education-Advisor-Setup.${ext}"

# macOS 产物显式无空格命名：electron-builder 的 ArchiveTarget（mac zip）
# 生成 blockmap 时传入的是带空格的原始文件名（上游 bug），GitHub 会把
# 空格规范化为点号，导致重跑同一 tag 时资产名匹配失败（422 already_exists）。
# 无空格命名后 dmg/zip/blockmap 名称跨运行完全一致，覆盖上传可靠。
mac:
  artifactName: "Education-Advisor-${arch}.${ext}"

# 显式指定 Linux 目标：electron-builder 26 未配置时默认构建 snap，
# GitHub runner 无 snapcraft 必然失败，且 deb 也不会被构建。
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Education
  # 与 win/mac 同理固定命名（deb 内部版本号仍来自 package.json，不受文件名影响）
  artifactName: "Education-Advisor.${ext}"
  # deb 包要求 maintainer（package.json author 无 email 时必须显式指定）
  maintainer: "232252 <111100881+232252@users.noreply.github.com>"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true

# 不从源码重编原生模块：better-sqlite3 / node-pty / koffi 随包都带 N-API prebuilds，
# 实测在 Electron 的 ABI 与本机 node 的 ABI(147) 下都能 require 并跑通真实
# SQL；而源码重编在本机会卡在 node-pty 的 MSB8040(要 VS 的 Spectre 库组件)，即使
# 成功也会把 Electron ABI 的 build/Release/*.node 写进 node_modules，反过来让
# vitest(纯 node)加载失败。关掉它等于把"上次产物里其实只有 prebuilds"这件事写明。
npmRebuild: false

asar: true
# 选择性解包（第四轮安装提速）：安装时间由解包文件数主导（NSIS 逐文件解压 +
# 杀软逐文件扫描，bench-install.mjs 实测 36.5s 里 36.3s 是落盘风暴）。整树
# 解包是社区公认反模式（electron-builder#8640）——只把「dsh 子进程依赖闭包 +
# 原生件」留在真实磁盘，其余纯 JS 依赖（openai/@aws-sdk/@anthropic-ai 等
# ~200 包，只有主进程用）收进 app.asar：主进程读 asar 透明，安装时变成
# 1 个大文件顺序写 + 1 次杀软扫描。闭包清单由 prepackage 链的
# scripts/compute-unpack-closure.mjs 按本机 node_modules 生成（勿手改哨兵块
# 内内容）：dsh 闭包之外，smartUnpack 会整包解出的原生可选包（@pnpm/exe 与
# @napi-rs/canvas 的 win/mac/linux 变体，含 musl 与 mac 两个架构里实际装上
# 的那些）也写进清单，否则 linux/mac 的 afterPack 守卫会把它们当成预料外
# 解包。守卫在 after-pack-trim.mjs 4c 与 verify-dsh-package --dist。
asarUnpack:
  - "**/*.exe"
  - "**/*.node"
  - "**/*.dll"
  # >>> unpack-closure (generated by scripts/compute-unpack-closure.mjs — 勿手改) >>>
  # dsh 子进程（staged node.exe）依赖闭包：
  - "node_modules/@deepseek-ai/**"
