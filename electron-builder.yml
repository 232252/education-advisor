appId: com.education-advisor.app
productName: Education Advisor
copyright: Copyright 2026

# CI 通过 --publish onTag 发布并生成 latest*.yml 自动更新清单
# 本地构建不加 --publish 时默认 onTagOrDraft（仅 tag 提交才发布）
publish:
  provider: github
  owner: 232252
  repo: education-advisor

directories:
  output: release-v11
  buildResources: resources

files:
  - dist/**/*
  - node_modules/**/*

extraResources:
  - from: resources/icon.ico
    to: icon.ico
  - from: resources/icon.png
    to: icon.png
  # 托盘多分辨率帧 (16@1x / 32@2x), 高 DPI 下托盘图标清晰
  - from: resources/icon-16.png
    to: icon-16.png
  - from: resources/icon-32.png
    to: icon-32.png
  - from: resources/eaa-binaries/
    to: eaa-binaries/
    filter: ["**/*"]
  - from: config/
    to: config/
    filter: ["**/*"]
  - from: agents/
    to: agents/
    filter: ["**/*"]

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: resources/icon.ico
  artifactName: "${productName}-${version}-Setup.${ext}"

# portable 沿用 win.artifactName 会与 NSIS 输出同名互相覆盖，
# 并导致同一文件被并发重复上传（曾引发 Request timed out），
# 这里单独命名为 Portable 以区分。
portable:
  artifactName: "${productName}-${version}-Portable.${ext}"

# macOS 产物显式无空格命名：electron-builder 的 ArchiveTarget（mac zip）
# 生成 blockmap 时传入的是带空格的原始文件名（上游 bug），GitHub 会把
# 空格规范化为点号，导致重跑同一 tag 时资产名匹配失败（422 already_exists）。
# 无空格命名后 dmg/zip/blockmap 名称跨运行完全一致，覆盖上传可靠。
mac:
  artifactName: "Education-Advisor-${version}-${arch}.${ext}"

# 显式指定 Linux 目标：electron-builder 26 未配置时默认构建 snap，
# GitHub runner 无 snapcraft 必然失败，且 deb 也不会被构建。
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Education
  # deb 包要求 maintainer（package.json author 无 email 时必须显式指定）
  maintainer: "232252 <2322527175@qq.com>"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true

asar: true
asarUnpack:
  - "**/*.exe"
  - "**/*.node"
  - "**/*.dll"
