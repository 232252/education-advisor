name: Release

# 云端打包并发布，不在本地编译安装包。
# 触发方式：
#   1. 推送 main：package.json 的 version 在 GitHub 上还没有 Release 时自动发版
#   2. 推送 tag：v*.*.*
#   3. Actions → Release → Run workflow（补发 / 只打 Windows）
on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "版本 tag（如 v3.3.0）。留空则用 package.json 的 version"
        required: false
        type: string
      platforms:
        description: "打包平台"
        type: choice
        options:
          - all
          - win
        default: all

# 同一 ref 上不叠两次发版（main 自动发 / tag / 手动）。
concurrency:
  group: release-v3-${{ github.event_name == 'workflow_dispatch' && (inputs.tag || github.sha) || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  # ----------------------------------------------------------------
  # 解析版本、生成矩阵。main 自动发版时若 tag 不存在会在本 job 推 tag
  #（GITHUB_TOKEN 推 tag 不会再触发本 workflow，打包必须在这一次 run 里做完）。
  # ----------------------------------------------------------------
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      matrix: ${{ steps.meta.outputs.matrix }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      should_release: ${{ steps.meta.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve tag, version, matrix
        id: meta
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_PLATFORMS: ${{ github.event.inputs.platforms }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHOULD=true
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            RAW="${INPUT_TAG:-}"
            if [ -z "$RAW" ]; then
              RAW="v$(node -p "require('./package.json').version")"
            fi
            PLATFORMS="${INPUT_PLATFORMS:-all}"
          elif [ "$EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            RAW="v$(node -p "require('./package.json').version")"
            PLATFORMS="all"
          else
            RAW="$REF_NAME"
            PLATFORMS="all"
          fi
          RAW="${RAW#v}"
          TAG="v${RAW}"
          VERSION="$RAW"
          PRE=false
          case "$VERSION" in
            *-rc*|*-beta*|*-alpha*) PRE=true ;;
          esac

          if [ "$EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              echo "GitHub Release $TAG already exists; skip auto-release on main push"
              SHOULD=false
            fi
          fi

          if [ "$PLATFORMS" = "win" ]; then
            MATRIX='{"include":[{"os":"windows-latest","target":"win","arch":"x64"}]}'
          else
            MATRIX='{"include":[{"os":"windows-latest","target":"win","arch":"x64"},{"os":"macos-latest","target":"mac","arch":"x64"},{"os":"macos-latest","target":"mac","arch":"arm64"},{"os":"ubuntu-22.04","target":"linux","arch":"x64"}]}'
          fi

          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "prerelease=$PRE"
            echo "should_release=$SHOULD"
            echo "matrix=$MATRIX"
          } >> "$GITHUB_OUTPUT"
          echo "Release $TAG (version=$VERSION platforms=$PLATFORMS prerelease=$PRE should_release=$SHOULD)"

      - name: Ensure git tag exists
        if: steps.meta.outputs.should_release == 'true'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
          echo "Created and pushed $TAG"

  # ----------------------------------------------------------------
  # 质量门禁只跑一次（不再在每个打包机上重复 typecheck/lint/test）。
  # ----------------------------------------------------------------
  quality:
    name: Quality gates
    needs: [prepare]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        env:
          RELEASE_CI: "1"
        run: npm run test

  # ----------------------------------------------------------------
  # 各平台只编 Rust + 打安装包。
  # ----------------------------------------------------------------
  build:
    name: Build ${{ matrix.target }} (${{ matrix.arch }})
    needs: [prepare, quality]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust EAA binary from source
        shell: bash
        run: |
          set -euo pipefail
          cd core/eaa-cli
          cargo build --release
          cd ../..
          PLATFORM_DIR="$(node -e 'const o=require("os"); console.log(o.platform()+"-"+o.arch())')"
          TARGET="resources/eaa-binaries/${PLATFORM_DIR}"
          mkdir -p "$TARGET"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "core/eaa-cli/target/release/eaa.exe" "$TARGET/eaa.exe"
          else
            cp "core/eaa-cli/target/release/eaa" "$TARGET/eaa"
            chmod +x "$TARGET/eaa"
          fi
          ls -la "$TARGET/"

      - name: Build
        shell: bash
        run: npm run build

      - name: Package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          for var in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!var}" ]; then unset "$var"; fi
          done
          # 手动触发不在 tag ref 上，必须 --publish always；版本由 prepare 注入。
          ARGS=(--${{ matrix.target }} --${{ matrix.arch }} --publish always
                --config.extraMetadata.version="${RELEASE_VERSION}")
          if ! npx electron-builder "${ARGS[@]}"; then
            echo "::warning::electron-builder 打包/上传失败，60 秒后重试一次"
            sleep 60
            npx electron-builder "${ARGS[@]}"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            release-v*/*.exe
            release-v*/*.dmg
            release-v*/*.AppImage
            release-v*/*.deb
            release-v*/latest*.yml
            release-v*/*.blockmap
            site-build/assets/media/eea-intro.mp4
          retention-days: 14
          if-no-files-found: warn

  # ----------------------------------------------------------------
  # 正式发布 GitHub Release（安装包已由 electron-builder 上传）。
  # ----------------------------------------------------------------
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true'
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Generate checksums
        shell: bash
        run: |
          cd artifacts
          find . -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" \) \
            -exec sha256sum {} \; > SHA256SUMS
          cat SHA256SUMS

      - name: Sign checksums (cosign)
        if: vars.SIGN_CHECKSUMS == 'true'
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign-blob --yes \
            --output-signature artifacts/SHA256SUMS.sig \
            --output-certificate artifacts/SHA256SUMS.pem \
            artifacts/SHA256SUMS
        continue-on-error: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          draft: false
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            artifacts/SHA256SUMS
            artifacts/SHA256SUMS.sig
            artifacts/SHA256SUMS.pem
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
