name: Release

# 云端打包并发布。正式 Release 只从这里出去，不在打包步骤里上传。
# electron-builder 会在每个产物生成时就开始排队上传，所以打包必须
# --publish never；体积门禁通过之后，publish job 才把安装包放上 Release。
# 不要缓存 release-v11 或 win-unpacked。npm cache 只覆盖依赖。
# 触发方式：
#   1. 推送 main：package.json 的 version 在 GitHub 上还没有 Release 时自动发版
#   2. 推送 tag：v*.*.*
#   3. Actions → Release → Run workflow（补发 / 只打 Windows）
on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "版本 tag（如 v3.3.0）。留空则用 package.json 的 version"
        required: false
        type: string
      platforms:
        description: "打包平台"
        type: choice
        options:
          - all
          - win
        default: all

# 同一 ref 上不叠两次发版（main 自动发 / tag / 手动）。
concurrency:
  group: release-v3-${{ github.event_name == 'workflow_dispatch' && (inputs.tag || github.sha) || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  # ----------------------------------------------------------------
  # 解析版本、生成矩阵。main 自动发版时若 tag 不存在会在本 job 推 tag
  #（GITHUB_TOKEN 推 tag 不会再触发本 workflow，打包必须在这一次 run 里做完）。
  # ----------------------------------------------------------------
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      matrix: ${{ steps.meta.outputs.matrix }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      should_release: ${{ steps.meta.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve tag, version, matrix
        id: meta
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_PLATFORMS: ${{ github.event.inputs.platforms }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHOULD=true
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            RAW="${INPUT_TAG:-}"
            if [ -z "$RAW" ]; then
              RAW="v$(node -p "require('./package.json').version")"
            fi
            PLATFORMS="${INPUT_PLATFORMS:-all}"
          elif [ "$EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            RAW="v$(node -p "require('./package.json').version")"
            PLATFORMS="all"
          else
            RAW="$REF_NAME"
            PLATFORMS="all"
          fi
          RAW="${RAW#v}"
          TAG="v${RAW}"
          VERSION="$RAW"
          PRE=false
          case "$VERSION" in
            *-rc*|*-beta*|*-alpha*) PRE=true ;;
          esac

          if [ "$EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              echo "GitHub Release $TAG already exists; skip auto-release on main push"
              SHOULD=false
            fi
          fi

          if [ "$PLATFORMS" = "win" ]; then
            MATRIX='{"include":[{"os":"windows-latest","target":"win","arch":"x64"}]}'
          else
            MATRIX='{"include":[{"os":"windows-latest","target":"win","arch":"x64"},{"os":"macos-latest","target":"mac","arch":"x64"},{"os":"macos-latest","target":"mac","arch":"arm64"},{"os":"ubuntu-22.04","target":"linux","arch":"x64"}]}'
          fi

          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "prerelease=$PRE"
            echo "should_release=$SHOULD"
            echo "matrix=$MATRIX"
          } >> "$GITHUB_OUTPUT"
          echo "Release $TAG (version=$VERSION platforms=$PLATFORMS prerelease=$PRE should_release=$SHOULD)"

      - name: Ensure git tag exists
        if: steps.meta.outputs.should_release == 'true'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
          echo "Created and pushed $TAG"

  # ----------------------------------------------------------------
  # 质量门禁只跑一次（不再在每个打包机上重复 typecheck/lint/test）。
  # ----------------------------------------------------------------
  quality:
    name: Quality gates
    needs: [prepare]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        env:
          RELEASE_CI: "1"
        run: npm run test

      # 装配门禁含打包脚本接线（prepackage、体积预算、禁止预打包目录）。
      # 不在这里打 Windows 安装包。
      - name: dsh assembly and pack wiring
        run: npm run verify:dsh

  # ----------------------------------------------------------------
  # 各平台只编 Rust + 打安装包。
  # ----------------------------------------------------------------
  build:
    name: Build ${{ matrix.target }} (${{ matrix.arch }})
    needs: [prepare, quality]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust EAA binary from source
        shell: bash
        run: |
          set -euo pipefail
          cd core/eaa-cli
          cargo build --release
          cd ../..
          PLATFORM_DIR="$(node -e 'const o=require("os"); console.log(o.platform()+"-"+o.arch())')"
          TARGET="resources/eaa-binaries/${PLATFORM_DIR}"
          mkdir -p "$TARGET"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "core/eaa-cli/target/release/eaa.exe" "$TARGET/eaa.exe"
          else
            cp "core/eaa-cli/target/release/eaa" "$TARGET/eaa"
            chmod +x "$TARGET/eaa"
          fi
          ls -la "$TARGET/"

      - name: Build
        shell: bash
        run: npm run build

      # prepackage 生成 dsh-node、office-kit、dsh-im 依赖和两份 STORE zip。
      # npm 不会在 electron-builder 之前自动跑它，所以这里显式调用。
      - name: Stage dsh packaging prerequisites
        shell: bash
        run: npm run prepackage

      - name: Package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          for var in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!var}" ]; then unset "$var"; fi
          done
          # --publish never：上传放到后面的 publish job，体积门禁失败时不会先把
          # 安装包传上去。Electron 下载超时由包装器删掉 unpacked 目录后重试一次，
          # 并重新跑 afterPack。不要把已有目录交给打包器。
          node scripts/run-electron-builder.mjs \
            --${{ matrix.target }} --${{ matrix.arch }} \
            --publish never \
            --config.extraMetadata.version="${RELEASE_VERSION}"

      - name: Pack budget (win)
        if: matrix.target == 'win'
        shell: bash
        run: node scripts/check-pack-budget.mjs --output release-v11 --require-setup

      - name: Pack budget (mac/linux resources)
        if: matrix.target != 'win'
        shell: bash
        run: node scripts/check-pack-budget.mjs --output release-v11

      # 产物级门禁：安装包落盘后核对离线三件套、sweep 边界与字体发射确实
      # 生效（此前只在 ci.yml 跑且不带 --dist，发布产物本身没有断言）。
      - name: Verify packaged app (win)
        if: matrix.target == 'win'
        shell: bash
        run: npm run verify:dsh -- --dist release-v11/win-unpacked

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            release-v*/*.exe
            release-v*/*.dmg
            release-v*/*.AppImage
            release-v*/*.deb
            release-v*/latest*.yml
            release-v*/*.blockmap
            site-build/assets/media/eea-intro.mp4
          retention-days: 14
          if-no-files-found: error

      # office 转 PDF 的那一个 deflate zip。afterPack 会把它放进 Setup；
      # 同一份 zip 再挂到 Release 上，作为损坏后的修复通道。
      - name: Upload office-kit asset
        if: matrix.target == 'win'
        uses: actions/upload-artifact@v7
        with:
          name: office-kit
          path: build/office-kit/*.zip
          retention-days: 14
          if-no-files-found: error

  # ----------------------------------------------------------------
  # 正式发布 GitHub Release。安装包只有体积门禁通过后才会出现在 artifacts 里。
  # ----------------------------------------------------------------
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true'
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Generate checksums
        shell: bash
        run: |
          cd artifacts
          find . -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" \) \
            -exec sha256sum {} \; > SHA256SUMS
          cat SHA256SUMS

      - name: Sign checksums (cosign)
        if: vars.SIGN_CHECKSUMS == 'true'
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign-blob --yes \
            --output-signature artifacts/SHA256SUMS.sig \
            --output-certificate artifacts/SHA256SUMS.pem \
            artifacts/SHA256SUMS
        continue-on-error: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          draft: false
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            artifacts/SHA256SUMS
            artifacts/SHA256SUMS.sig
            artifacts/SHA256SUMS.pem
            artifacts/office-kit/*.zip
            artifacts/installer-*/**/*.exe
            artifacts/installer-*/**/*.dmg
            artifacts/installer-*/**/*.AppImage
            artifacts/installer-*/**/*.deb
            artifacts/installer-*/**/*.blockmap
            artifacts/installer-*/**/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
