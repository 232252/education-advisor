name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Cancel in-progress runs for the same tag.
# 组名带 -v2 后缀：历史上曾出现 run 卡死在 queued（无法 cancel/delete），
# 改组名可绕开被卡死 run 占用的旧 concurrency 队列。
concurrency:
  group: release-v2-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  # ----------------------------------------------------------------
  # Build all platform installers.
  # ----------------------------------------------------------------
  build:
    name: Build ${{ matrix.target }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64 — NSIS + portable
          - os: windows-latest
            target: win
            arch: x64
          # macOS x64 (Intel) — dmg
          - os: macos-latest
            target: mac
            arch: x64
          # macOS arm64 (Apple Silicon) — dmg
          - os: macos-latest
            target: mac
            arch: arm64
          # Linux x64 — AppImage + deb
          - os: ubuntu-22.04
            target: linux
            arch: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Typecheck
        shell: bash
        run: npm run typecheck

      - name: Lint
        shell: bash
        run: npm run lint

      - name: Test
        # RELEASE_CI=1 让 vitest 跳过重度 UI 压力测试
        # (tests/e2e/user-flow-simulation.test.tsx),避免 Linux 上因 EAA
        # 二进制在流水线中不可靠而阻塞发布。本地 npm run test 不受影响。
        env:
          RELEASE_CI: "1"
        shell: bash
        run: npm run test

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust EAA binary from source
        # We build from source (core/eaa-cli/) rather than downloading a
        # prebuilt release: the Rust source IS in this monorepo, so there
        # is no need to keep a separate release pipeline in sync. The
        # binary is then placed in the location electron-builder expects.
        shell: bash
        run: |
          set -euo pipefail
          cd core/eaa-cli
          cargo build --release
          cd ../..
          PLATFORM_DIR="$(node -e 'const o=require("os"); console.log(o.platform()+"-"+o.arch())')"
          TARGET="resources/eaa-binaries/${PLATFORM_DIR}"
          mkdir -p "$TARGET"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "core/eaa-cli/target/release/eaa.exe" "$TARGET/eaa.exe"
          else
            cp "core/eaa-cli/target/release/eaa" "$TARGET/eaa"
            chmod +x "$TARGET/eaa"
          fi
          ls -la "$TARGET/"

      - name: Build
        shell: bash
        run: npm run build

      - name: Package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code signing environment variables (set in repo settings)
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          # electron-builder treats an EMPTY CSC_LINK as "set" and then
          # path.resolve(currentDir, '') resolves to the project root,
          # which is a directory not a file → "X not a file" error.
          # Unset the code-signing env vars when they are empty so
          # electron-builder skips code signing entirely.
          for var in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!var}" ]; then unset "$var"; fi
          done
          # CI 网络抖动时上传大安装包偶发 Request timed out（v3.2.0 曾因
          # Setup.exe 上传 4 分钟超时失败），失败后整体重试一次。
          # electron-builder 对已存在的同名资产会自动 overwrite，重试幂等。
          ARGS=(--${{ matrix.target }} --${{ matrix.arch }} --publish onTag
                --config.extraMetadata.version=${GITHUB_REF_NAME#v})
          if ! npx electron-builder "${ARGS[@]}"; then
            echo "::warning::electron-builder 打包/上传失败，60 秒后重试一次"
            sleep 60
            npx electron-builder "${ARGS[@]}"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.target }}-${{ matrix.arch }}
          # electron-builder.yml 将输出目录设为 release-v*（如 release-v11），
          # 上传路径需与之匹配；缺失某种平台文件类型时不应中断工作流。
          # M31 自动更新: latest*.yml 是 electron-updater 的更新清单
          # (electron-builder 打 NSIS/AppImage 目标时自动生成,含安装包真实
          # sha512);*.blockmap 供差量下载。缺失时自动更新完全失效。
          path: |
            release-v*/*.exe
            release-v*/*.dmg
            release-v*/*.AppImage
            release-v*/*.deb
            release-v*/latest*.yml
            release-v*/*.blockmap
          retention-days: 14
          if-no-files-found: warn

  # ----------------------------------------------------------------
  # Publish the GitHub Release.
  # ----------------------------------------------------------------
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      id-token: write # for sigstore / cosign signing
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Generate checksums
        shell: bash
        run: |
          cd artifacts
          find . -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" \) \
            -exec sha256sum {} \; > SHA256SUMS
          cat SHA256SUMS

      - name: Sign checksums (cosign)
        # Cosign keyless OIDC signing requires a Fulcio server reachable
        # from the runner AND OIDC token exchange. For pre-releases and
        # local builds we just skip it. For GA releases, set the
        # \`SIGN_CHECKSUMS\` repository variable to "true\" to enable.
        if: startsWith(github.ref, 'refs/tags/v') && vars.SIGN_CHECKSUMS == 'true'
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign-blob --yes \
            --output-signature artifacts/SHA256SUMS.sig \
            --output-certificate artifacts/SHA256SUMS.pem \
            artifacts/SHA256SUMS
        continue-on-error: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          generate_release_notes: true
          # electron-builder --publish onTag 已把全部安装包、latest*.yml 与
          # blockmap 直传到（草稿）Release；此处仅负责正式发布 Release 并补充
          # 校验和。若再上传安装包，本地带空格的文件名会被 GitHub 规范化为
          # 点号，与 electron-builder 的连字符命名并存形成重复资产。
          files: |
            artifacts/SHA256SUMS
            artifacts/SHA256SUMS.sig
            artifacts/SHA256SUMS.pem
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
