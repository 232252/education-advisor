name: Sync Release to Gitee

# GitHub Release 发布完成后，自动同步全部可镜像资产到 Gitee。
# - Release 工作流成功结束时自动触发（workflow_run）
# - 也可手动指定 tag 触发（补同步历史版本）
#
# Gitee 免费版单附件 100MB 上限：超限安装包会被跳过（预检），
# 并在 Gitee release 描述中自动追加官网/GitHub 下载指引。
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "要同步的 Release tag（如 v3.2.0）"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gitee-sync-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      GITEE_OWNER: qdzwwqd
      GITEE_REPO: education-advisor
    steps:
      - name: Resolve tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            # tag 推送触发 Release 时 head_branch 就是 v3.3.0；
            # 在 main 上「Run workflow」时 head_branch 是 main，必须改查刚发布的 tag。
            CANDIDATE="${{ github.event.workflow_run.head_branch }}"
            if [[ "$CANDIDATE" == v*.*.* ]]; then
              TAG="$CANDIDATE"
            else
              TAG=$(gh release list --repo "${{ github.repository }}" --limit 20 \
                --json tagName,isDraft,isPrerelease,createdAt \
                --jq '[.[] | select(.isDraft==false)] | sort_by(.createdAt) | reverse | .[0].tagName // empty')
            fi
          fi
          if [ -z "${TAG:-}" ]; then
            echo "::error::无法解析要同步的 Release tag"
            exit 1
          fi
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::GitHub 上不存在 Release $TAG"
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "Syncing release $TAG to Gitee"

      - name: Download GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          gh release download "$TAG" --repo "${{ github.repository }}" --dir assets --clobber
          # 排除仅供 GitHub 差量更新使用的文件（*.blockmap / mac *.zip / AppImage）：
          # 它们体积大且对手动下载无用，可有效控制 Gitee 附件总量。
          rm -f assets/*.blockmap assets/*-x64.zip assets/*-arm64.zip assets/*.AppImage
          # Gitee 免费版单附件 100MB 上限：上传前预检，超限文件直接跳过，
          # 避免完整传输数分钟后才被服务端拒绝。
          MAX_BYTES=$((100 * 1024 * 1024))
          SKIPPED=""
          for f in assets/*; do
            [ -f "$f" ] || continue
            size=$(stat -c%s "$f")
            if [ "$size" -gt "$MAX_BYTES" ]; then
              echo "::warning::跳过 $(basename "$f")（$(du -h "$f" | cut -f1) 超出 Gitee 单附件 100MB 上限）"
              SKIPPED="$SKIPPED $(basename "$f")"
              rm -f "$f"
            fi
          done
          echo "SKIPPED_ASSETS=$SKIPPED" >> "$GITHUB_ENV"
          echo "--- Assets to sync ---"
          du -h assets/* 2>/dev/null || echo "（无可同步附件）"

      - name: Recreate Gitee release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          API="https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO"

          BODY=$(gh release view "$TAG" --repo "${{ github.repository }}" --json body -q .body)

          # 有超限跳过的安装包时，在描述末尾追加下载指引（幂等标记便于识别）
          if [ -n "${SKIPPED_ASSETS:-}" ]; then
            NOTE=$(cat <<NOTEEOF
          <!-- gitee-download-note -->
          ---

          ## 下载说明

          以下安装包体积超出 Gitee 免费版单附件 100MB 上限，本镜像仅同步 \`SHA256SUMS\` 校验和与 \`latest*.yml\` 自动更新清单：$SKIPPED_ASSETS

          **安装包请从以下渠道下载：**
          - 官网（推荐）：https://eea.qdzwwqd.top/download.html
          - GitHub Release：https://github.com/232252/education-advisor/releases/tag/$TAG
          NOTEEOF
            )
            BODY="$BODY$NOTE"
          fi

          # 幂等重建：删除旧 release（连同旧附件）后重新创建。
          # 注：Gitee 的 PATCH 更新接口对 query-token 认证不生效，
          # 删除重建是唯一可靠的幂等方式；附件随后重新上传，URL 按 tag+文件名保持稳定。
          OLD_ID=$(curl -sS "$API/releases/tags/$TAG?access_token=$GITEE_TOKEN" | jq -r '.id // empty' 2>/dev/null || true)
          if [ -n "$OLD_ID" ]; then
            echo "Deleting existing Gitee release $OLD_ID (recreate for idempotency)"
            curl -sS -X DELETE "$API/releases/$OLD_ID?access_token=$GITEE_TOKEN" >/dev/null || true
          fi

          RELEASE_ID=$(jq -n \
            --arg tag "$TAG" \
            --arg name "Release $TAG" \
            --arg body "$BODY" \
            --arg branch "main" \
            '{tag_name:$tag, name:$name, body:$body, prerelease:false, target_commitish:$branch}' \
            | curl -sS -X POST "$API/releases?access_token=$GITEE_TOKEN" \
              -H "Content-Type: application/json" -d @- | jq -r '.id')
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "::error::Failed to create Gitee release for $TAG"
            exit 1
          fi
          echo "RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"
          echo "Gitee release id: $RELEASE_ID"

      - name: Upload assets to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          API="https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO"

          failed=0
          total=0
          for f in assets/*; do
            [ -f "$f" ] || continue
            total=$((total+1))
            name=$(basename "$f")
            size=$(du -h "$f" | cut -f1)
            echo "Uploading $name ($size)..."
            if curl -sSf -X POST \
                 "$API/releases/$RELEASE_ID/attach_files?access_token=$GITEE_TOKEN" \
                 -F "file=@$f" >/dev/null; then
              echo "  -> OK"
            else
              echo "::warning::上传失败: $name（可能超出 Gitee 单附件 100MB 限制）"
              failed=$((failed+1))
            fi
          done
          echo "FAILED_COUNT=$failed" >> "$GITHUB_ENV"
          echo "TOTAL_COUNT=$total" >> "$GITHUB_ENV"

      - name: Summary
        shell: bash
        run: |
          {
            echo "### Gitee 镜像同步结果"
            echo "- Tag: \`$TAG\`"
            echo "- 附件总数: $TOTAL_COUNT，失败: $FAILED_COUNT"
            if [ -n "${SKIPPED_ASSETS:-}" ]; then
              echo "- 超限跳过（>100MB）:$SKIPPED_ASSETS"
              echo "- 安装包请从 [官网](https://eea.qdzwwqd.top/download.html) 或 [GitHub Release](https://github.com/232252/education-advisor/releases/tag/$TAG) 下载"
            fi
            echo "- 镜像地址: https://gitee.com/$GITEE_OWNER/$GITEE_REPO/releases/tag/$TAG"
          } >> "$GITHUB_STEP_SUMMARY"
