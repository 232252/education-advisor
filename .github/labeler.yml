# Labels applied automatically by .github/workflows/labeler.yml
# actions/labeler v6: each label is a list of match objects.
# https://github.com/actions/labeler/tree/v6.2.0#pull-request-labeler

# ----- Area labels (one or more applied based on changed paths) -----
"area: agents":
  - changed-files:
      - any-glob-to-any-file:
          - agents/**/SOUL.md
          - agents/**/AGENTS.md
          - config/agents.yaml
"area: renderer":
  - changed-files:
      - any-glob-to-any-file: src/renderer/**/*
"area: main":
  - changed-files:
      - any-glob-to-any-file: src/main/**/*
"area: shared":
  - changed-files:
      - any-glob-to-any-file: src/shared/**/*
"area: docs":
  # docs tree, or a root markdown file that is not CHANGELOG.md.
  # all-globs-to-any-file requires one file to satisfy every glob, so
  # CHANGELOG.md matches "*.md" but not the negation and does not count.
  - changed-files:
      - any-glob-to-any-file: docs/**/*
      - all-globs-to-any-file:
          - "*.md"
          - "!**/CHANGELOG.md"
"area: build":
  - changed-files:
      - any-glob-to-any-file:
          - package.json
          - package-lock.json
          - electron-builder.yml
          - vite.config.*.ts
          - tsconfig.json
          - biome.json
"area: ci":
  - changed-files:
      - any-glob-to-any-file: .github/**/*
"area: i18n":
  - changed-files:
      - any-glob-to-any-file: src/renderer/i18n/**/*
"area: eaa":
  - changed-files:
      - any-glob-to-any-file:
          - scripts/build-eaa.mjs
          - docs/EAA_BRIDGE.md
"area: privacy":
  - changed-files:
      - any-glob-to-any-file:
          - "**/privacy*"
          - "**/keystore*"
"area: cron":
  - changed-files:
      - any-glob-to-any-file: "**/cron*"
"area: feishu":
  - changed-files:
      - any-glob-to-any-file: "**/feishu*"

# ----- Type labels -----
# base-branch is a regexp (v5+). ^main$ is the old baseBranches: [main].
"type: bug":
  - base-branch: "^main$"
"type: feature":
  - base-branch: "^main$"
"type: refactor":
  - base-branch: "^main$"
"type: docs":
  - base-branch: "^main$"
"type: test":
  - base-branch: "^main$"
"type: agent":
  - base-branch: "^main$"

# ----- Size labels (set by the size-bot, not by labeler) -----
# "size: XS", "size: S", "size: M", "size: L", "size: XL"
