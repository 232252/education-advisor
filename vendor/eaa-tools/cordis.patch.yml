# 操行查询、加减分，以及没有单独插件的工具走这里。
# 花名册、成绩、批改各自有插件。没有 EAA_MCP_URL 时整段关掉。
# 有地址时必须连上：连不上就不要假装这个 profile 能办这些事。
- insert:
    - id: eaa-tools
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: !!js "!process.env.EAA_MCP_URL"
      config:
        transport: streamable-http
        serverName: eaa
        url: !!js "process.env.EAA_MCP_URL || 'http://127.0.0.1:9/mcp/unused'"
        headers:
          authorization: !!js "process.env.EAA_MCP_TOKEN ? 'Bearer ' + process.env.EAA_MCP_TOKEN : 'Bearer unused'"
        toolCallTimeoutMs: 120000
        failOnStartupError: true
